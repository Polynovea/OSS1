name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run sdk:build
      - run: npm run cms -- --help
      - run: npm run seed:starter -- --help
      - run: npm ci --prefix examples/nextjs-site
      - run: npm run typecheck --prefix examples/nextjs-site
      - run: npm run build --prefix examples/nextjs-site
      - run: npm audit --omit=dev --prefix examples/nextjs-site
      - run: git diff --check
      - run: npm audit --omit=dev
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Scan Git history for secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source=. --config=.gitleaks.toml --redact --verbose
  database-certification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.8.1.085
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run lib/infrastructure/databaseProvisioning.test.ts
