name: polynovea-cms-local
services:
  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - ${POLYNOVEA_DATA_DIR}/postgres:/var/lib/postgresql/data
      - ../../supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./bootstrap-db.sh:/docker-entrypoint-initdb.d/zzzz-polynovea-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: 3000

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${POLYNOVEA_SUPABASE_PORT}
      GOTRUE_SITE_URL: http://localhost:${POLYNOVEA_APP_PORT}
      GOTRUE_URI_ALLOW_LIST: http://localhost:${POLYNOVEA_APP_PORT}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - rest
      - auth
    ports:
      - "${POLYNOVEA_SUPABASE_PORT}:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  cms:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:${POLYNOVEA_SUPABASE_PORT}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      gateway:
        condition: service_started
    ports:
      - "${POLYNOVEA_APP_PORT}:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://gateway:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      CMS_CONFIG_ENCRYPTION_KEY: ${CMS_CONFIG_ENCRYPTION_KEY}
      POLYNOVEA_LOCAL_RUNTIME_CONTROL: "1"
      DELIVERY_WORKER_QUEUES: default,intelligence,media
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

  worker:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:${POLYNOVEA_SUPABASE_PORT}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    command: ["node", "scripts/delivery-worker.mjs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      CMS_CONFIG_ENCRYPTION_KEY: ${CMS_CONFIG_ENCRYPTION_KEY}
      DELIVERY_WORKER_QUEUES: default,intelligence,media
      NEXT_PUBLIC_SUPABASE_URL: http://gateway:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-media}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
